name: ai_assistant
description: Personal AI Assistant — Aurora Dark, voice-first mobile app.
publish_to: 'none'
version: 0.5.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP + SSE streaming
  http: ^1.2.1

  # State management
  provider: ^6.1.2

  # Voice input
  speech_to_text: ^6.6.2

  # Voice output
  flutter_tts: ^4.0.2

  # Permissions
  permission_handler: ^11.3.1

  # Persistent settings (base URL, selected agent)
  shared_preferences: ^2.3.2

  # Unique session IDs
  uuid: ^4.5.0

  # Animations
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # App icon generation — run: flutter pub run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.1

  # Splash screen — run: flutter pub run flutter_native_splash:create
  flutter_native_splash: ^2.4.0

# ── App Icon Configuration ─────────────────────────────────────────────────────
# Source icon: assets/icon/app_icon.png (1024x1024, no transparency for Android)
# Run: flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
  windows:
    generate: false

# ── Splash Screen Configuration ────────────────────────────────────────────────
# Run: flutter pub run flutter_native_splash:create
flutter_native_splash:
  color: "#080D12"
  image: assets/icon/splash_logo.png
  color_dark: "#080D12"
  image_dark: assets/icon/splash_logo.png
  android_12:
    color: "#080D12"
    image: assets/icon/splash_logo.png
  android: true
  ios: true
  web: true

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
